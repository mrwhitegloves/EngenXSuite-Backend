# Runs on every push and pull request: the same checks as on a developer's computer.
# A red result means: do not deploy this commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the secrets scan looks at every commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The in-memory MongoDB used by the tests is a large download; keep it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run lint
      - run: npm run check:names
      - run: npm test

      - name: Scan for committed secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --no-banner

  # Deploys to Google Cloud Run, only after every check above passed, and only for a push to
  # main. GitHub signs in to Google without a stored key (Workload Identity Federation); the two
  # repository variables below are set once (docs/runbooks/deploy.md, section C). Without them
  # this job is skipped. Settings and secrets of the service are kept from the last deploy.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # One deploy at a time; a newer push waits for the running one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PROJECT: mr-white-gloves-production
      REGION: asia-south1
      SERVICE: engenx-crm
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: gcloud run deploy "$SERVICE" --source . --project "$PROJECT" --region "$REGION" --quiet

      # A new version that does not start is not given traffic by Cloud Run; this also checks
      # that the version now serving answers with its database, Redis and storage up.
      - name: Health check
        run: |
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format 'value(status.url)')"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$url/api/health"
