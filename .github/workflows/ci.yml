# Runs on every push and pull request: the same checks as on a developer's computer.
# A red result means: do not deploy this commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the secrets scan looks at every commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The in-memory MongoDB used by the tests is a large download; keep it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run lint
      - run: npm run check:names
      - run: npm test

      - name: Scan for committed secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --no-banner

  # Deploys to the Compute Engine VM, only after every check above passed, and only for a push
  # to main. GitHub signs in to Google without a stored key (Workload Identity Federation); the
  # two repository variables below are set once (docs/runbooks/deploy.md, section C). Without
  # them this job is skipped. The settings and secrets live in the VM's env file, not here.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # One deploy at a time; a newer push waits for the running one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PROJECT: mr-white-gloves-production
      ZONE: asia-south1-a
      VM: mwg-apps-vm
      APP: engenx-crm
      HEALTH_URL: https://crm-api.engenx.in/api/health
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # The server runs in Docker on the Compute Engine VM (decision 0015). deploy.sh on the VM
      # pulls this commit, builds the image, starts it and puts the previous image back when the
      # new one does not answer its health check. The connection goes through IAP (no open SSH).
      - name: Deploy
        run: |
          gcloud compute ssh "$VM" --zone "$ZONE" --project "$PROJECT" --tunnel-through-iap --quiet             --command "sudo /opt/apps/bin/deploy.sh $APP $GITHUB_SHA"

      # Checks from outside that the version now serving answers with its database up.
      - name: Health check
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$HEALTH_URL"
